<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Good Landing Fixture</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #111827; background: #f8fafc; }
      main { max-width: 960px; margin: 0 auto; padding: 48px 20px; }
      a, button { min-height: 44px; border-radius: 8px; padding: 12px 16px; }
      a { display: inline-flex; align-items: center; background: #111827; color: white; text-decoration: none; }
      .proof { margin-top: 24px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
      .proof div { border: 1px solid #d1d5db; border-radius: 8px; padding: 16px; background: white; }
    </style>
  </head>
  <body>
    <main>
      <p>Live voice practice</p>
      <h1>Practice real conversations before your next interview</h1>
      <p>Try a short voice demo, see the correction loop, and create a free account when the product proves it can help.</p>
      <a href="/demo">Try the voice demo</a>
      <section class="proof" aria-label="Proof">
        <div>3-minute demo</div>
        <div>Clear correction example</div>
        <div>Free account path</div>
      </section>
    </main>
  </body>
</html>
